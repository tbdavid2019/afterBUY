<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45140"/>
      <stop offset="40%" stop-color="#a03f30"/>
      <stop offset="100%" stop-color="#722419"/>
    </linearGradient>

    <!-- Top Ambient Glass Glow -->
    <linearGradient id="topGlow" x1="50%" y1="0%" x2="50%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ring Track Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ffedd5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3d120c" flood-opacity="0.5"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="136" fill="url(#topGlow)"/>
  <rect x="3" y="3" width="506" height="506" rx="133" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Concentric Orbital Grid -->
  <circle cx="256" cy="235" r="185" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="235" r="130" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="10 8" stroke-width="2"/>

  <!-- Dynamic Cycle Orbit Ring -->
  <g filter="url(#shadow)">
    <!-- 290-degree clockwise cycle arc -->
    <path d="M 125 315 A 155 155 0 1 1 366 126" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Sleek Arrowhead pointing clockwise along tangent -->
    <polygon points="366,108 392,138 354,142" fill="#ffffff"/>
  </g>

  <!-- Central Brand Typography: 888 -->
  <g filter="url(#shadow)">
    <text x="256" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="124" fill="#ffffff" letter-spacing="-2">888</text>
  </g>

  <!-- Subtitle Badge: 該換囉 -->
  <g filter="url(#shadow)">
    <rect x="131" y="278" width="250" height="64" rx="32" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="131" y="278" width="250" height="64" rx="32" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="256" y="322" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="5">該換囉</text>
  </g>

  <!-- Green Freshness Badge (Health / Replaced Status) at Top Right -->
  <g filter="url(#badgeShadow)">
    <circle cx="390" cy="116" r="30" fill="#10b981"/>
    <circle cx="390" cy="116" r="30" stroke="#ffffff" stroke-width="4.5"/>
    <path d="M 379 116 L 387 124 L 403 108" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
