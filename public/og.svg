<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glow-sky" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-indigo" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow-sky)" />
  <rect width="1200" height="630" fill="url(#glow-indigo)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Main Left Content -->
  <g transform="translate(80, 100)">
    <!-- Logo Badge -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="20" fill="url(#logo-grad)" filter="drop-shadow(0 10px 20px rgba(56,189,248,0.3))" />
      <text x="36" y="47" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="1">aB</text>
      
      <!-- Brand Name -->
      <text x="92" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">afterBUY</text>
      <rect x="305" y="16" width="68" height="28" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
      <text x="339" y="35" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">PWA</text>
    </g>

    <!-- Main Title Slogan -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="900" font-size="52" letter-spacing="0">
      買了之後，別再忘記換！
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="500" font-size="22">
      手機優先 PWA · 耗材週期 · 開封保存 (PAO) · 保固倒數 · 備品庫存
    </text>

    <!-- 4 Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: Passkey -->
      <g transform="translate(0, 0)">
        <rect width="240" height="52" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#0284c7" fill-opacity="0.2" />
        <text x="28" y="31" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">⚡</text>
        <text x="52" y="32" fill="#f1f5f9" font-family="-apple-system, 'PingFang TC', sans-serif" font-weight="600" font-size="15">Passkey 生物辨識秒登</text>
      </g>

      <!-- Pill 2: WebCal -->
      <g transform="translate(255, 0)">
        <rect width="230" height="52" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#6366f1" fill-opacity="0.2" />
        <text x="28" y="31" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">📅</text>
        <text x="52" y="32" fill="#f1f5f9" font-family="-apple-system, 'PingFang TC', sans-serif" font-weight="600" font-size="15">WebCal 日曆同步</text>
      </g>

      <!-- Pill 3: Replaced Today -->
      <g transform="translate(0, 64)">
        <rect width="240" height="52" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#10b981" fill-opacity="0.2" />
        <text x="28" y="31" fill="#34d399" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">🔄</text>
        <text x="52" y="32" fill="#f1f5f9" font-family="-apple-system, 'PingFang TC', sans-serif" font-weight="600" font-size="15">一鍵已換自動扣庫存</text>
      </g>

      <!-- Pill 4: Push & Email -->
      <g transform="translate(255, 64)">
        <rect width="230" height="52" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
        <circle cx="28" cy="26" r="14" fill="#f59e0b" fill-opacity="0.2" />
        <text x="28" y="31" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">🔔</text>
        <text x="52" y="32" fill="#f1f5f9" font-family="-apple-system, 'PingFang TC', sans-serif" font-weight="600" font-size="15">推播與晨間摘要</text>
      </g>
    </g>
  </g>

  <!-- Right Side Mockup Visual -->
  <g transform="translate(730, 80)">
    <!-- Floating Card 1: Due Item (Toothbrush) -->
    <g transform="translate(40, 20)">
      <rect width="350" height="150" rx="20" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.6" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
      <rect x="20" y="20" width="64" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" />
      <text x="52" y="36" fill="#22d3ee" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">衛浴洗沐</text>
      <text x="95" y="37" fill="#ffffff" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="16" font-weight="700">Oral-B 電動牙刷頭</text>
      
      <!-- Progress & Badge -->
      <text x="20" y="75" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">到期日: 2026-03-05</text>
      <rect x="235" y="60" width="95" height="24" rx="12" fill="#f43f5e" fill-opacity="0.2" />
      <text x="282" y="76" fill="#fb7185" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">剩餘 3 天 ⏳</text>
      
      <!-- Progress line -->
      <rect x="20" y="95" width="310" height="6" rx="3" fill="#334155" />
      <rect x="20" y="95" width="40" height="6" rx="3" fill="#f43f5e" />
      
      <!-- Bottom row -->
      <text x="20" y="130" fill="#64748b" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="12">備品庫存: <tspan fill="#f1f5f9" font-weight="700">2</tspan></text>
      <rect x="235" y="110" width="95" height="28" rx="10" fill="#0284c7" />
      <text x="282" y="128" fill="#ffffff" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">今天已換</text>
    </g>

    <!-- Floating Card 2: Healthy Item (Water Filter) -->
    <g transform="translate(0, 200)">
      <rect width="350" height="150" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))" />
      <rect x="20" y="20" width="64" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" />
      <text x="52" y="36" fill="#fbbf24" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">廚房飲食</text>
      <text x="95" y="37" fill="#ffffff" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="16" font-weight="700">Brita 淨水濾芯</text>
      
      <!-- Progress & Badge -->
      <text x="20" y="75" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">到期日: 2026-06-01</text>
      <rect x="235" y="60" width="95" height="24" rx="12" fill="#10b981" fill-opacity="0.2" />
      <text x="282" y="76" fill="#34d399" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">剩餘 90 天</text>
      
      <!-- Progress line -->
      <rect x="20" y="95" width="310" height="6" rx="3" fill="#334155" />
      <rect x="20" y="95" width="280" height="6" rx="3" fill="#10b981" />
      
      <!-- Bottom row -->
      <text x="20" y="130" fill="#64748b" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="12">備品庫存: <tspan fill="#f1f5f9" font-weight="700">3</tspan></text>
      <rect x="235" y="110" width="95" height="28" rx="10" fill="#334155" />
      <text x="282" y="128" fill="#e2e8f0" font-family="-apple-system, 'PingFang TC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">今天已換</text>
    </g>
  </g>
</svg>
