name = "afterbuy"
main = "src/api/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare Scheduled Triggers (Daily Cron at 08:00 AM UTC+8 = 00:00 UTC)
[triggers]
crons = ["0 0 * * *"]

# ------------------------------------------------
# Local Development Fallbacks
# ------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "afterbuy-db"
database_id = "afterbuy-d1-local"
migrations_dir = "drizzle/migrations"

[[kv_namespaces]]
binding = "KV"
id = "afterbuy-kv-local"

[[r2_buckets]]
binding = "R2"
bucket_name = "afterbuy-r2-local"

[vars]
APP_NAME = "afterBUY"
APP_ORIGIN = "http://localhost:5173"
EMAIL_FROM = "afterBUY <notifications@create360.ai>"
VAPID_PUBLIC_KEY = ""
VAPID_PRIVATE_KEY = ""
VAPID_SUBJECT = "mailto:support@afterbuy.app"
CRON_SECRET = "afterbuy-cron-secret-local"
SESSION_SECRET = "afterbuy-super-secure-session-secret-local-32chars"

